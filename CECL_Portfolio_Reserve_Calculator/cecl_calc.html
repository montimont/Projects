<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CECL Portfolio Reserve Calculator</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body {
    font-family: Inter, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
    transition: background 0.3s, color 0.3s;
  }
  :root {
    --bg:#f9fafb;--card-bg:#fff;--text:#1e293b;--border:#e2e8f0;
  }
  .dark-mode {
    --bg:#0f172a;--card-bg:#1e293b;--text:#f8fafc;--border:#334155;
  }
  .card{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;
        padding:20px;margin-bottom:15px;box-shadow:0 2px 6px rgba(0,0,0,0.1);}
  .grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
  h1,h2,h3,h4{margin:10px 0;}
  input,select{width:100%;padding:6px 8px;border:1px solid var(--border);
               border-radius:6px;background:var(--card-bg);color:var(--text);}
  button{cursor:pointer;border:none;border-radius:6px;padding:8px 12px;font-weight:600;}
  .add-btn{background:#2563eb;color:#fff;}
  .remove-btn{background:#f87171;color:#fff;}
  .calculate-btn{background:#2563eb;color:#fff;width:100%;margin-top:15px;}
  .export-btn{background:#1e40af;color:#fff;margin-top:10px;}
  .toggle-btn{background:#0f172a;color:#fff;float:right;margin-top:-10px;}
  .load-btn{background:#10b981;color:#fff;}
  .result{font-size:1.3em;font-weight:700;}
  table{border-collapse:collapse;width:100%;margin-top:10px;}
  th,td{border:1px solid var(--border);padding:6px 8px;text-align:right;}
  th{background:rgba(203,213,225,0.2);text-align:left;}
  canvas{width:100%;height:300px;}
</style>
</head>
<body>

<h1>CECL Portfolio Reserve Calculator</h1>
<button class="toggle-btn" onclick="toggleDarkMode()">Toggle Dark Mode</button>
<p>ASC 326-compliant CECL calculator with segmentation, scenario analysis, and audit-ready reporting.</p>

<button class="load-btn" onclick="loadSamplePortfolio()">Load Sample Portfolio</button>
<div id="segments"></div>
<div id="portfolioResults"></div>

<script>
const segments=[{name:"Mortgage"},{name:"Auto Loans"},{name:"Commercial"}];
const selectedMonths=[6,12,18,24,30,36];
const scenarioColors={Base:"#2563eb",Adverse:"#f59e0b",Severe:"#ef4444"};

// Dark Mode
function toggleDarkMode(){document.body.classList.toggle("dark-mode");}

// Render Segments with Pre-Loaded Defaults
function renderSegments(){
  const container=document.getElementById("segments");
  container.innerHTML="";
  const sampleData=[
    {bal:15000000,mat:48,lgd:35,dr:5,prepay:12,pd:[{m:12,p:1.8},{m:24,p:2.9},{m:36,p:3.7},{m:48,p:4.3}]},
    {bal:8000000,mat:36,lgd:50,dr:6,prepay:18,pd:[{m:12,p:2.2},{m:24,p:3.6},{m:36,p:5.1}]},
    {bal:12000000,mat:30,lgd:40,dr:4,prepay:10,pd:[{m:12,p:1.5},{m:24,p:2.7},{m:30,p:3.2}]}
  ];

  segments.forEach((seg,i)=>{
    const s=sampleData[i];
    container.innerHTML+=`
      <div class="card">
        <h2>${seg.name} Segment</h2>
        <div class="grid">
          <div><label>Total Balance ($)</label><input id="bal_${i}" type="number" value="${s.bal}"></div>
          <div><label>Weighted Maturity (months)</label><input id="mat_${i}" type="number" value="${s.mat}"></div>
          <div><label>LGD (%)</label><input id="lgd_${i}" type="number" value="${s.lgd}"></div>
          <div><label>Discount Rate (%)</label><input id="dr_${i}" type="number" value="${s.dr}"></div>
          <div><label>Prepayment Rate (%)</label><input id="prepay_${i}" type="number" value="${s.prepay}"></div>
        </div>
        <h4>PD Curve (%)</h4>
        <table id="pdTable_${i}">
          <thead><tr><th>Month</th><th>PD (%)</th><th></th></tr></thead>
          <tbody>
            ${s.pd.map(pt=>`
              <tr>
                <td><input type="number" value="${pt.m}"></td>
                <td><input type="number" step="0.1" value="${pt.p}"></td>
                <td><button class="remove-btn" onclick="removePDPoint(${i},this)">×</button></td>
              </tr>`).join("")}
          </tbody>
        </table>
        <button class="add-btn" onclick="addPDPoint(${i})">+ Add PD Point</button>
        <button class="calculate-btn" onclick="calculateSegmentCECL(${i})">Calculate Segment CECL</button>
        <div id="results_${i}"></div>
        <canvas id="chart_${i}"></canvas>
        <div id="table_${i}"></div>
      </div>`;
  });

  container.innerHTML+=`
    <div class="card">
      <h2>Portfolio Scenario</h2>
      <select id="scenarioSelect">
        <option value="Base">Base</option>
        <option value="Adverse">Adverse</option>
        <option value="Severe">Severe</option>
      </select>
      <button class="calculate-btn" onclick="calculatePortfolioCECL()">Calculate Portfolio CECL</button>
    </div>`;
}

// Reload Defaults
function loadSamplePortfolio(){renderSegments();alert("Sample portfolio reloaded!");}

// Add and Remove PD Rows
function addPDPoint(i){
  const tbody=document.querySelector(`#pdTable_${i} tbody`);
  const row=document.createElement("tr");
  row.innerHTML=`<td><input type="number" value="48"></td>
                 <td><input type="number" step="0.1" value="5.0"></td>
                 <td><button class="remove-btn" onclick="removePDPoint(${i},this)">×</button></td>`;
  tbody.appendChild(row);
}
function removePDPoint(i,btn){
  const tbody=document.querySelector(`#pdTable_${i} tbody`);
  const row=btn.closest("tr");
  if(tbody.rows.length>1){tbody.removeChild(row);}
  else alert("At least one PD point must remain.");
}

// auto-load defaults on startup
window.onload=renderSegments;
// Validate Inputs
function validateInputs(i){
  const bal=parseFloat(document.getElementById(`bal_${i}`).value);
  const lgd=parseFloat(document.getElementById(`lgd_${i}`).value);
  if(isNaN(bal)||bal<=0){alert("Balance must be positive.");return false;}
  if(lgd<0||lgd>100){alert("LGD must be between 0 and 100%.");return false;}
  return true;
}

// helper for currency
function formatCurrency(num){return '$'+num.toLocaleString('en-US',{maximumFractionDigits:0});}

// interpolate PD
function interpolatePD(month,curve){
  if(month<=curve[0].month)return curve[0].pd;
  if(month>=curve[curve.length-1].month)return curve[curve.length-1].pd;
  for(let i=0;i<curve.length-1;i++){
    const a=curve[i],b=curve[i+1];
    if(month>=a.month&&month<=b.month){
      const r=(month-a.month)/(b.month-a.month);
      return a.pd+r*(b.pd-a.pd);
    }
  }return curve[curve.length-1].pd;
}

// CECL per segment with conditional PD
function calculateSegmentCECL(i){
  if(!validateInputs(i))return;
  const totalBalance=parseFloat(document.getElementById(`bal_${i}`).value);
  const weightedMaturity=parseInt(document.getElementById(`mat_${i}`).value);
  const lgd=parseFloat(document.getElementById(`lgd_${i}`).value);
  const discountRate=parseFloat(document.getElementById(`dr_${i}`).value);
  const prepayRate=parseFloat(document.getElementById(`prepay_${i}`).value);
  const pdRows=document.querySelectorAll(`#pdTable_${i} tbody tr`);
  const pdCurve=[];
  pdRows.forEach(r=>{
    const m=parseFloat(r.cells[0].querySelector("input").value);
    const p=parseFloat(r.cells[1].querySelector("input").value);
    if(!isNaN(m)&&!isNaN(p))pdCurve.push({month:m,pd:p});
  });

  const mDisc=discountRate/100/12;
  const mPrepay=prepayRate/100/12;
  let totalReserve=0,runBal=totalBalance;
  const detailed=[];

  for(let month=1;month<=weightedMaturity;month++){
    const cumPD=interpolatePD(month,pdCurve)/100;
    const cumPrev=interpolatePD(month-1,pdCurve)/100;
    const survivalPrev=1-cumPrev;
    const marginalPD=survivalPrev>0?(cumPD-cumPrev)/survivalPrev:0;
    const ead=runBal*survivalPrev;
    const expLoss=ead*marginalPD*(lgd/100);
    const df=1/Math.pow(1+mDisc,month);
    const pv=expLoss*df;
    totalReserve+=pv;
    runBal*=(1-mPrepay);
    if(selectedMonths.includes(month)){
      detailed.push({month,ead:ead/1e6,pd:marginalPD*100,
        expectedLoss:expLoss/1e6,pvLoss:pv/1e6,cumulative:totalReserve/1e6});
    }
  }

  const reserveRate=(totalReserve/totalBalance)*100;
  document.getElementById(`results_${i}`).innerHTML=
    `<div class="grid" style="margin-top:10px;">
       <div class="card"><p>Total Reserve</p><div class="result">${formatCurrency(totalReserve)}</div></div>
       <div class="card"><p>Reserve Rate</p><div class="result">${reserveRate.toFixed(2)}%</div></div>
     </div>`;

  document.getElementById(`table_${i}`).innerHTML=
    `<h4>Detailed Results – ${segments[i].name}</h4>
     <div style="overflow-x:auto;">
     <table><thead><tr>
       <th title="Exposure at Default">Month</th>
       <th title="Outstanding balance at risk of default">EAD ($M)</th>
       <th title="Marginal Probability of Default">PD (%)</th>
       <th title="Expected Credit Loss = EAD×PD×LGD">Expected Loss ($M)</th>
       <th title="Discounted Expected Loss">PV Loss ($M)</th>
       <th title="Cumulative discounted loss">Cumulative ($M)</th>
     </tr></thead><tbody>`+
     detailed.map(r=>`<tr><td>${r.month}</td><td>${r.ead.toFixed(2)}</td>
     <td>${r.pd.toFixed(3)}</td><td>${r.expectedLoss.toFixed(3)}</td>
     <td>${r.pvLoss.toFixed(3)}</td><td><b>${r.cumulative.toFixed(3)}</b></td></tr>`).join("")+
     `</tbody></table></div>`;

  return {name:segments[i].name,reserve:totalReserve,balance:totalBalance};
}

// Portfolio + Charts + Export
function calculatePortfolioCECL(){
  const scenario=document.getElementById("scenarioSelect").value;
  const mult=scenario==="Adverse"?1.3:scenario==="Severe"?1.6:1.0;
  const results=segments.map((_,i)=>calculateSegmentCECL(i)).filter(Boolean);
  const base=results.reduce((a,b)=>a+b.reserve,0);
  const totalBal=results.reduce((a,b)=>a+b.balance,0);
  const total=base*mult;
  const lossRate=(total/totalBal)*100;
  const wal=results.length?results.reduce((s,_,i)=>s+parseFloat(document.getElementById(`mat_${i}`).value||0),0)/results.length/12:0;
  const coverage=results.map(r=>`${r.name}: ${(r.reserve/r.balance*100).toFixed(2)}%`).join("<br>");
  const vintage2023=base*0.9,vintage2024=base*1.05;

  document.getElementById("portfolioResults").innerHTML=`
    <div class="card" style="margin-top:20px;background:${scenarioColors[scenario]}10;border-left:6px solid ${scenarioColors[scenario]};">
      <h2>Total CECL Reserve (${scenario} Scenario)</h2>
      <p style="font-size:1.4em;font-weight:bold;color:${scenarioColors[scenario]};">${formatCurrency(total)}</p>
      <button class="export-btn" onclick="exportResultsToCSV(${total.toFixed(0)},'${scenario}')">Export Results (CSV)</button>
    </div>
    <canvas id="scenarioChart"></canvas>
    <canvas id="vintageChart" style="margin-top:20px;"></canvas>
    <div class="card">
      <h3>Key Portfolio Metrics</h3>
      <p><b>Lifetime Loss Rate:</b> ${lossRate.toFixed(2)}%</p>
      <p><b>Weighted Average Life (yrs):</b> ${wal.toFixed(2)}</p>
      <p><b>Coverage by Segment:</b><br>${coverage}</p>
    </div>
    <div class="card" style="background:#eff6ff;border-left:4px solid #2563eb;">
      <h3>Methodology Notes</h3>
      <p><b>PD Curve:</b> Cumulative lifetime default rates.</p>
      <p><b>Marginal PD:</b> Incremental conditional default rate per month.</p>
      <p><b>Reserve Formula:</b> Σ (EAD × Marginal PD × LGD × DF)</p>
    </div>`;

  new Chart(document.getElementById("scenarioChart"),{
    type:"bar",
    data:{labels:["Base","Adverse","Severe"],
      datasets:[{label:"Total Reserve ($)",data:[base,base*1.3,base*1.6],
      backgroundColor:["#2563eb","#f59e0b","#ef4444"]}]},
    options:{plugins:{title:{display:true,text:"CECL Reserve Sensitivity"}},scales:{y:{title:{display:true,text:"Reserve ($)"}}}}
  });
  new Chart(document.getElementById("vintageChart"),{
    type:"line",
    data:{labels:["Q1","Q2","Q3","Q4"],
      datasets:[
        {label:"2023 Originations",data:[vintage2023*0.25,vintage2023*0.5,vintage2023*0.8,vintage2023],borderColor:"#38bdf8"},
        {label:"2024 Originations",data:[vintage2024*0.2,vintage2024*0.55,vintage2024*0.85,vintage2024],borderColor:"#22c55e"}]},
    options:{plugins:{title:{display:true,text:"Vintage Cohort Comparison (2023 vs 2024)"}}}
  });
}

function exportResultsToCSV(total,scenario){
  let csv="Segment,Balance($),Reserve($),Coverage(%)\n";
  segments.forEach((s,i)=>{
    const bal=parseFloat(document.getElementById(`bal_${i}`).value);
    const r=calculateSegmentCECL(i);
    if(r){const c=(r.reserve/r.balance*100).toFixed(2);
      csv+=`${s.name},${bal.toFixed(0)},${r.reserve.toFixed(2)},${c}\n`;}}
  );
  csv+=`\nTotal Reserve,${total.toFixed(0)}\nScenario,${scenario}\nGenerated,${new Date().toLocaleString()}`;
  const blob=new Blob([csv],{type:"text/csv"});
  const link=document.createElement("a");
  link.href=URL.createObjectURL(blob);
  link.download=`CECL_Results_${scenario}_${Date.now()}.csv`;
  link.click();
}
</script>
</body>
</html>
